name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test reference crate
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Run mock example
        run: cargo run --manifest-path examples/rust-mock/Cargo.toml

  python:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byte-compile
        run: python -m py_compile python/hal_contract/*.py
      - name: Import check
        run: cd python && python -c "import hal_contract; print('hal_contract', hal_contract.__version__)"

  haskell:
    name: Haskell reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'
      - name: Build
        run: cd haskell && cabal update && cabal build
